{% extends "base.html" %}
{% set crumbs = [(res.plural, res.index_url()), (res.title(obj), None), (label, None)] %}
{% block content %}
<form class="form card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next_url }}">
  <p>Soll der Status von {{ res.singular }} „{{ res.title(obj) }}“ auf „{{ target | fmt_enum }}“ gesetzt werden?</p>
  <div class="form__actions">
    <button class="btn btn--primary" type="submit">{{ label }}</button>
    <a class="btn btn--secondary" href="{{ next_url }}">Abbrechen</a>
  </div>
</form>
{% endblock %}
