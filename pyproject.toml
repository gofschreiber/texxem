[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Resource/field definitions are declarative class attributes (read-only lists), not mutable state.
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:migrations.*"]
